# clinician/crude/configure.yaml -- API rater. Edit, then:
#   python clinician/crude/validate/rate_api.py plan      # size + cost estimate, sends nothing
#   python clinician/crude/validate/rate_api.py submit    # send the batch
#   python clinician/crude/validate/rate_api.py collect   # fetch results when the batch has ended
#   python clinician/crude/validate/report.py             # (validate mode) correlate with human TLI
#
# The rater sees the RESPONSE ONLY -- never the prompt that produced it -- so an
# off-topic answer can't be scored as disorder just for being off-topic.

name: tli_fable_1                   # names the output folder

mode: validate                      # validate = patient transcripts vs human TLI; rate = a client run

model: claude-fable-5-1             # most capable; claude-opus-5-5 is ~2.5x cheaper
effort: medium                      # low | medium | high | xhigh | max
max_tokens: 8000                    # thinking counts toward this

instruments:
  crude:                            # one call per item, wording verbatim from items.csv
    items: [tangential, loss_goal, derail, non_sequitur, distractable]
  tli: true                         # one call per response, all 8 TLI items (tli_prompt.md)

validate:
  # Patient data never enters the repo; read in place, write ratings next to it.
  data: C:/Users/martx/Analyses/0_securedata/0_finetunedata/out/tli_master.csv
  row_type: image                   # one picture description per row, per-image TLI targets
  text_col: response                # participant speech only, no interviewer turns
  output_root: C:/Users/martx/Analyses/0_securedata/0_finetunedata/ratings
  limit: null                       # e.g. 20 for a pilot batch

rate:
  run_csv: null                     # path to a client <run>.csv
  text_col: output
  output_root: analysis/ratings

# $ per million tokens, standard (the Batches API halves these)
prices:
  claude-fable-5-1: {input: 10.0, output: 50.0}
  claude-opus-5-5:  {input: 4.0,  output: 20.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
# Rough output tokens per call (thinking included) for the pre-flight estimate.
# `collect` reports the real usage.
estimate_output_tokens: {crude: 400, tli: 1500}
